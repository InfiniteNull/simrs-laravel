<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMRS Core Enterprise — Hospital Management Information System</title>
  <meta name="description" content="Sistem Informasi Manajemen Rumah Sakit (SIMRS) berbasis Laravel 11, PHP 8.2, dan MySQL yang selaras dengan Permenkes No. 24 Tahun 2022 dan SatuSehat FHIR." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230284c7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 6v12'/><path d='M6 12h12'/><rect width='18' height='18' x='3' y='3' rx='2'/></svg>" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.7);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased flex flex-col justify-between selection:bg-sky-500 selection:text-white">

  <!-- Top Global Header -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-sky-500/10 text-sky-400 flex items-center justify-center border border-sky-500/20 shadow-sm">
          <i data-lucide="hospital" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-slate-100 text-sm sm:text-base tracking-tight">SIMRS Core Enterprise</h1>
            <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">PRODUKSI</span>
          </div>
          <p class="text-xs text-slate-400 font-mono">Laravel 11 • PHP 8.2 • MySQL • Permenkes 24/2022</p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <a href="https://infinitenull.github.io/" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center gap-1.5 transition">
          <i data-lucide="home" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">Hub Portofolio ↗</span>
        </a>
        <a href="https://github.com/InfiniteNull/simrs-laravel" target="_blank" rel="noopener noreferrer" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-white text-slate-900 flex items-center gap-1.5 transition shadow-sm">
          <i data-lucide="github" class="w-3.5 h-3.5"></i>
          <span>GitHub Source ↗</span>
        </a>
      </div>

    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    <div id="simrsSuiteRoot">
      <!-- Populated dynamically by js/simrs-laravel-suite.js -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/80 bg-slate-900/60 py-6 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 space-y-1 font-mono">
      <p>SIMRS Core Enterprise • Hospital Information System Standard Architecture</p>
      <p>© 2026 <a href="https://github.com/InfiniteNull" class="text-sky-400 hover:underline">Rizki Ananda, S.Kom (@InfiniteNull)</a> • Handcrafted with Clean Code & Professional IT Standards.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/simrs-laravel-suite.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.getElementById('simrsSuiteRoot');
      if (root && typeof window.renderSimrsSuite === 'function') {
        window.renderSimrsSuite(root);
      }
      if (window.lucide) {
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
